<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background-color: #050a05;
      color: #00ff41;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 10px;
    }
    h2 { font-size: 1.2rem; border-bottom: 1px solid #008f11; padding-bottom: 5px; }
    textarea {
      width: 100%;
      height: 80px;
      background: #000;
      color: #00ff41;
      border: 1px solid #008f11;
      padding: 5px;
      margin-top: 10px;
      box-sizing: border-box;
    }
    button {
      background: #008f11;
      color: #fff;
      border: none;
      padding: 8px 12px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    button:hover { background: #00ff41; color: #000; }
    #log { margin-top: 20px; font-size: 0.8rem; color: #008f11; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>JESTER C&C</h2>
  <div>DOM Control & Chat</div>
  <textarea id="prompt" placeholder="Command JESTER..."></textarea>
  <button id="sendBtn">EXECUTE</button>
  <div id="log"></div>
  <script src="sidepanel.js"></script>
</body>
</html>
