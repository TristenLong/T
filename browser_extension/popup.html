<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JESTER Memory Clip</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      padding: 16px;
      font-family: 'Courier New', Courier, monospace;
      background-color: #050b06;
      color: #00ff66;
      text-shadow: 0 0 5px rgba(0, 255, 102, 0.4);
      border: 1px solid #00ff6633;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #00ff6644;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #00ff66;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      background: #003311;
      border: 1px solid #00ff66;
      border-radius: 3px;
      color: #a3ffc2;
    }
    .desc {
      font-size: 11px;
      line-height: 1.4;
      color: #88cc99;
      margin-bottom: 14px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      background-color: #021a08;
      color: #00ff66;
      border: 1px solid #00ff66;
      padding: 10px;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-transform: uppercase;
    }
    button:hover {
      background-color: #00ff66;
      color: #000;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.6);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      padding: 8px;
      font-size: 11px;
      min-height: 18px;
      border-radius: 3px;
      text-align: center;
      display: none;
      word-break: break-word;
    }
    .status.success {
      display: block;
      background: #003311;
      color: #00ff66;
      border: 1px solid #00ff66;
    }
    .status.error {
      display: block;
      background: #330005;
      color: #ff4455;
      border: 1px solid #ff4455;
      text-shadow: 0 0 5px rgba(255, 68, 85, 0.4);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ JESTER MEMORY</div>
    <div class="badge">ONLINE</div>
  </div>
  <p class="desc">Sync active webpage or content directly into JESTER neural memory vault.</p>
  <div class="actions">
    <button id="sendPageBtn">🔗 Link Current URL</button>
    <button id="extractPageBtn">📄 Ingest Page Content</button>
  </div>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
