<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JESTER · Dig Dug (self-hosted)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  #dd { position: fixed; inset: 0; }
  /* constrain the emulator canvas to 960x540 centered so the game never
     stretches over the full viewport (which would put the agent's fixed HUD
     overlay inside every screenshot). Left/right margins stay clean. */
  #dd .emscripten, #dd canvas, #dd .game-container { max-width: 960px; max-height: 540px; margin: 0 auto; }
  #dd { display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
  <div id="dd"></div>
  <script>
    window.EJS_player = '#dd';
    window.EJS_core = 'arcade';
    window.EJS_pathtodata = '/data/';
    window.EJS_gameUrl = '/rom/digdug.zip';
    window.EJS_biosUrl = '/bios/arcade.7z';
    window.EJS_gameName = 'Dig Dug';
    window.EJS_startOnLoaded = false;
    window.EJS_fullscreenOnLoaded = false;
    window.EJS_volume = 0.3;
    window.EJS_disableAutoLang = true;
    window.EJS_hideSettings = true;
    window.EJS_screenRecording = false;
  </script>
  <script src="/data/loader.js"></script>
</body>
</html>
