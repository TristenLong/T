[project]
name = "pipecat-quickstart"
version = "0.1.0"
description = "Quickstart example for building voice AI bots with Pipecat"
requires-python = ">=3.10"
dependencies = [
    "pipecat-ai[webrtc,silero,deepgram,openai,google,cartesia,local-smart-turn-v3,runner]",
    "pipecat-ai-cli",
    "google-generativeai>=0.8.6",
    "psutil>=7.2.1",
    "pyautogui>=0.9.54",
    "pyperclip>=1.11.0",
    "opencv-python>=4.12.0.88",
    "numpy>=2.2.6",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]
