[project]
name = "pipecat-quickstart"
version = "0.1.0"
description = "Quickstart example for building voice AI bots with Pipecat"
requires-python = ">=3.10"
dependencies = [
    "pipecat-ai[webrtc,silero,deepgram,openai,google,cartesia,local-smart-turn-v3,runner]",
    "pipecat-ai-cli",
    "google-generativeai>=0.8.6",
    "psutil>=7.2.1",
    "pyautogui>=0.9.54",
    "pyperclip>=1.11.0",
    "opencv-python>=4.12.0.88",
    "numpy>=2.2.6",
    "edge-tts>=7.2.8",
    "speechrecognition>=3.17.0",
    "pygame>=2.6.1",
    "sounddevice>=0.5.6",
    "scikit-learn>=1.7.2",
    "pandas>=2.3.3",
    "matplotlib>=3.10.9",
    "praw>=8.0.3",
    "ddgs>=9.15.0",
    "duckduckgo-search>=8.1.1",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "loguru>=0.7.3",
    "openai>=2.54.0",
    "pillow>=11.3.0",
    "aiohttp>=3.14.3",
    "websockets>=15.0.1",
    "beautifulsoup4>=4.15.0",
    "kokoro-onnx>=0.6.1",
    "chromadb>=1.5.9",
    "scipy>=1.15.3",
    "neo4j>=6.2.0",
    "docker>=7.2.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]

[tool.pyright]
extraPaths = [".."]
